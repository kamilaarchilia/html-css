<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TABELAS</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 500px;
            border-collapse: collapse;
        }
        caption{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1.5em;
            font-weight: bold;
            padding: 10px;
            background-color: aqua;
        }
        td{
            border: 1px solid black;
            padding: 10px;
        }
        th{
            border: 1px solid black;
            padding: 10px;
        }
        thead, tfoot{
            background-color: aquamarine;
        }
        td.num {
            text-align: right;
        }
        tbody > tr:nth-child(odd) { /*efeito zebrado nas linhas ímpares */
            background-color: brown;
        }
        tbody > tr:nth-child(even) { /* efeito zebrado nas linhas pares */
            background-color: rgb(87, 68, 68);
        }
    </style>
</head>
<body>
    <h1>Uso de tabelas grandes</h1>
    <!-- 
    ANATOMIA DE TABELAS GRADES
    TABLE
        CAPTION
        THEAD
            tr, td, th
        TBODY
            tr,td,th
        TFOOT
            tr,td,th 
    -->

    <table>
        <caption>Tabela de habitantes do Brasil</del></caption>
        <thead>
            <tr>
                <th scope="col">ESTADO</th>
                <th scope="col" style="width: 50px;">POPULAÇÃO</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>São Paulo</td>
                <td class="num">46 081 801</td>
            </tr>
            <tr>
                <td>Minas Gerais</td>
                <td class="num">21 393 441</td>
            </tr>
            <tr>
                <td>Rio de Janeiro</td>
                <td class="num">17 223 547</td>
            </tr>
            <tr>
                <td>Bahia</td>
                <td class="num">14 870 907</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th scope="row">TOTAL DE HABITANTES</th>
                <td>00000</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
