<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TABELAS</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 400px;
            border-collapse: collapse;
        }
        tr.linha{
            background-color: blanchedalmond;
        }
        td{
            border: 1px solid black;
            padding: 8px;
        }
        td.dado{
            background-color: red;
        }
    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <table>
        <tr class="linha"> <!-- primeira linha -->
            <td>célula 1</td>
            <td>célula 2</td>
            <td>célula 3</td>
        </tr>
        <tr> <!-- segunda linha -->
            <td class="dado">célula 4</td>
            <td>célula 5</td>
            <td>célula 6</td>
        </tr>
        <tr> <!-- terceira linha -->
            <td>célula 7</td>
            <td>célula 8</td>
            <td>célula 9</td>
        </tr>
    </table>
</body>
</html>
