<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela Complexa</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            border-collapse: collapse;
            width: 600px;
        }
        caption{ 
            font-size: 1.3em;
            font-weight: bold;
            padding: 10px;
            border: 1px solid black;
            background-color: antiquewhite;
        }
        td, th{
            text-align: center;
            border: 1px solid black;
            padding: 5px;
        }
        th.cabeça{
            background-color: antiquewhite;
        }
        th.meio{
            text-align: left;
            background-color: antiquewhite;
        }
        th.final{
            text-align: left;
            background-color: antiquewhite;
        }
        td.meio{
            background-color: antiquewhite;
            text-align: center;
        }
        td.final{
            background-color: antiquewhite;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Tabela de Notas</h1>
    <table>
        <caption>
            Médias das Notas
        </caption>
        <thead>
            <tr>
                <th rowspan="2" scope="row" class="cabeça">Área</th>
                <th rowspan="2" scope="row" class="cabeça">Disciplina</th>
                <th colspan="2" scope="rowgroup" class="cabeça">Notas</th>
                <th rowspan="2" scope="rowgroup" class="cabeça">Média</th>
            </tr>
            <tr>
                <th scope="row" class="cabeça">Nota 1</th>
                <th scope="row" class="cabeça">Nota 2</th>
            </tr>
            <tr>
                <th rowspan="4" scope="rowgroup">Exatas</th>
                <td>Matemática</td>
                <td>10</td>
                <td>10</td>
                <td>10</td>
            </tr>
            <tr>
                <td>Física</td>
                <td>10</td>
                <td>10</td>
                <td>10</td>
            </tr>
            <tr>
                <td>Química</td>
                <td>10</td>
                <td>10</td>
                <td>10</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>10</td>
                <td>10</td>
                <td>10</td>
            </tr>
            <tr>
                <th colspan="4" class="meio" scope="row">Média de Exatas</th>
                <td class="meio">10</td>
            </tr>
            <tr>
                <th rowspan="2" scope="rowgroup">Humanas</th>
                <td>História</td>
                <td>10</td>
                <td>10</td>
                <td>10</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>10</td>
                <td>10</td>
                <td>10</td>
            </tr>
            <tr>
                <th colspan="4" class="final" scope="row"> Média de Humanas</th>
                <td class="final">10</td>
            </tr>
        </thead>
    </table>
</body>
</html>
